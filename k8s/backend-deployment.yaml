apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template: 
    metadata:
      labels: 
        app: backend
    spec:
      initContainers: 
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - until pg_isready -h $DB_HOST -U $DB_USER -d $DB_NAME; do echo waiting for database; sleep 2; done;
          envFrom:
            - configMapRef:
                name: kubecoin-config
            - secretRef:
                name: kubecoin-secrets
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "40m"
              memory: "64Mi"
      containers:
        - name: backend
          image: vikasabhimanyu/backend:dev-661dcf1
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: kubecoin-config
            - secretRef:
                name: kubecoin-secrets
          # Resource constraints
          resources:
            requests:
              memory: "150Mi"
              cpu: "150m"
            limits:
              memory: "300Mi"
              cpu: "300m"



